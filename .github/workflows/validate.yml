name: Validate

on:
  pull_request:
    branches: [source]
  push:
    branches: [source]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable --check-cache
      # Fork PRs only. The trailer's job is provenance for contributions we do not
      # already hold the rights to, which is exactly the fork case; requiring it on
      # branches pushed to this repository adds friction without adding a record.
      - name: DCO check
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^..HEAD"
          else
            range="HEAD"
          fi
          for commit in $(git rev-list --no-merges "$range"); do
            git log -1 --format=%B "$commit" | grep -qi '^Signed-off-by:' || {
              echo "Commit $commit is missing Signed-off-by trailer"
              exit 1
            }
          done
      - name: Informational dependency audit
        run: yarn npm audit --severity high || true
      - name: Validate source and reproducibility
        run: yarn run validate
      - name: Validate rendered packages
        run: yarn run validate:rendered
      - name: Validate packaging
        run: yarn run validate:packaging
      - name: Validate Cursor package
        run: yarn run validate:cursor
      - name: Smoke test packages
        run: yarn run smoke
