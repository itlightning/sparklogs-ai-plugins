# The only exceptions to `scripts/check-advisories.mjs`: one entry per advisory, each with the
# advisory id, why it does not apply or cannot be fixed yet, and the date it lapses (at most 90
# days out; on that date, UTC, the check goes red again). No severity threshold and no
# package-wide ignore; the script rejects any other key or syntax, and an entry that matches no
# current advisory. Format (one line per value):
#
#   [[IgnoredVulns]]
#   id = "GHSA-xxxx-xxxx-xxxx"
#   reason = "Why this advisory does not reach us, or what blocks the upgrade."
#   ignoreUntil = 2027-01-31
